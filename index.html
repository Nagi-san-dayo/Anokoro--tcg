<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あの頃の自作TCG風 サンドボックス</title>
    <!-- 小学生の手書き文字っぽさを出すためのGoogleフォント「Yomogi」 -->
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Yomogi', cursive;
            background-color: #fdfdfd;
            /* 自由帳や学習ノートの罫線をCSSで再現 */
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee 1px, transparent 1px);
            background-size: 100% 30px;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .area {
            border: 2px solid #555;
            border-radius: 10px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
        }
        .status {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .field {
            min-height: 160px;
            display: flex;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #aaa;
            background: rgba(0, 0, 0, 0.02);
            overflow-x: auto;
        }
        .hand {
            min-height: 160px;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
        }
        .card {
            min-width: 110px;
            width: 110px;
            height: 160px;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: white;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            padding: 5px;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        /* カードの種類ごとの色分け */
        .card.monster { border-color: #d32f2f; }
        .card.magic { border-color: #1976d2; }
        .card.energy { border-color: #388e3c; }
        
        .card .name { font-size: 14px; font-weight: bold; border-bottom: 1px solid #ccc; margin-bottom: 4px; text-align: center;}
        .card .cost { position: absolute; top: 3px; right: 3px; background: #f0f0f0; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; font-size: 12px; border: 1px solid #333;}
        .card .img-placeholder { width: 100%; height: 50px; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; margin-bottom: 4px;}
        .card .text { font-size: 11px; line-height: 1.3; }
        .card .stats { position: absolute; bottom: 3px; right: 3px; font-size: 12px; font-weight: bold; background: white; padding: 2px; border: 1px solid #333; }
        .card.exhausted { filter: grayscale(100%); opacity: 0.7; pointer-events: none; }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        button {
            font-family: 'Yomogi', cursive;
            font-size: 18px;
            padding: 5px 15px;
            cursor: pointer;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            box-shadow: 2px 2px 0 #333;
        }
        button:active {
            box-shadow: 0 0 0 #333;
            transform: translate(2px, 2px);
        }
        .log-box {
            height: 80px;
            overflow-y: auto;
            border: 2px solid #ccc;
            padding: 5px;
            background: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 相手のエリア（今回は的としてのみ機能） -->
    <div class="area opponent-area">
        <div class="status">
            <span>あいてのHP: <span id="opp-hp">4000</span></span>
        </div>
    </div>

    <!-- ログ表示エリア -->
    <div class="log-box" id="log"></div>

    <!-- 自分のエリア -->
    <div class="area player-area">
        <div class="status">
            <span>じぶんのHP: <span id="pl-hp">4000</span></span>
            <span>エネルギー: <span id="pl-energy">0</span> / <span id="pl-max-energy">0</span></span>
        </div>
        
        <div class="controls">
            <span>▼ 自分の場 (クリックして攻撃)</span>
            <button onclick="endTurn()">ターンエンド</button>
        </div>
        <div class="field" id="field"></div>
        
        <div style="margin-top: 10px;">▼ 手札 (クリックして使う / 場に出す)</div>
        <div class="hand" id="hand"></div>
    </div>
</div>

<script>
    // --- カードのデータベース（ラクガキのようなカードたち） ---
    const cardDatabase = [
        { type: 'energy', name: 'エネルギー', text: '使うと最大エネルギーが1ふえる。', cost: 0 },
        { type: 'monster', name: '最強ドラゴン', text: 'すべてをほろぼすつよいドラゴン。', cost: 3, atk: 500, hp: 1000 },
        { type: 'monster', name: 'でんせつの剣士', text: 'めちゃくちゃ修行した剣士。', cost: 2, atk: 300, hp: 600 },
        { type: 'monster', name: 'スライム', text: 'よわい。', cost: 1, atk: 100, hp: 200 },
        { type: 'magic', name: 'ほのおのまほう', text: 'あいてに200ダメージ！', cost: 1 },
        { type: 'magic', name: 'かいふく薬', text: 'じぶんのHPを500かいふく。', cost: 1 }
    ];

    // --- ゲームのステータス ---
    let oppHP = 4000;
    let plHP = 4000;
    let maxEnergy = 0;
    let currentEnergy = 0;
    let hand = [];
    let field = [];
    let turnCount = 1;

    function logMessage(msg) {
        const logBox = document.getElementById('log');
        logBox.innerHTML += `<div>${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // --- カードを引く ---
    function drawCard() {
        const randomCard = Object.assign({}, cardDatabase[Math.floor(Math.random() * cardDatabase.length)]);
        randomCard.id = Date.now() + Math.random(); // 一意のIDを付与
        hand.push(randomCard);
    }

    // --- 手札のカードを使う ---
    function playCard(index) {
        const card = hand[index];
        if (currentEnergy < card.cost) {
            alert("エネルギーがたりないよ！");
            return;
        }

        currentEnergy -= card.cost;
        hand.splice(index, 1); // 手札から削除

        if (card.type === 'energy') {
            maxEnergy += 1;
            currentEnergy += 1;
            logMessage(`エネルギーをチャージした！ 最大エネルギーが ${maxEnergy} になった！`);
        } else if (card.type === 'monster') {
            card.canAttack = false; // 出したターンは攻撃できない（召喚酔い）
            field.push(card);
            logMessage(`モンスター「${card.name}」を場にだした！`);
        } else if (card.type === 'magic') {
            logMessage(`まほう「${card.name}」をつかった！`);
            if (card.name === 'ほのおのまほう') {
                oppHP -= 200;
                logMessage(`あいてに200ダメージ！`);
            } else if (card.name === 'かいふく薬') {
                plHP += 500;
                logMessage(`じぶんのHPが500かいふくした！`);
            }
        }
        
        checkWin();
        render();
    }

    // --- モンスターで攻撃する ---
    function attackWithMonster(index) {
        const monster = field[index];
        if (!monster.canAttack) return;

        oppHP -= monster.atk;
        monster.canAttack = false; // 攻撃済みにする
        logMessage(`「${monster.name}」のこうげき！ あいてに ${monster.atk} のダメージ！`);
        
        checkWin();
        render();
    }

    // --- ターン終了 ---
    function endTurn() {
        turnCount++;
        // エネルギーを全回復
        currentEnergy = maxEnergy;
        // モンスターを再び攻撃可能にする
        field.forEach(m => m.canAttack = true);
        
        logMessage(`--- ターン ${turnCount} ---`);
        drawCard(); // ターン開始時のドロー
        render();
    }

    // --- 勝利判定 ---
    function checkWin() {
        if (oppHP <= 0) {
            oppHP = 0;
            setTimeout(() => alert("あいてのHPを0にした！ 君の勝ちだ！"), 100);
        }
    }

    // --- 画面の描画 ---
    function createCardHTML(card, index, location) {
        const isHand = location === 'hand';
        const isExhausted = location === 'field' && !card.canAttack;
        
        let html = `<div class="card ${card.type} ${isExhausted ? 'exhausted' : ''}" 
                         onclick="${isHand ? `playCard(${index})` : `attackWithMonster(${index})`}">`;
        
        if (card.type !== 'energy') {
            html += `<div class="cost">${card.cost}</div>`;
        }
        html += `<div class="name">${card.name}</div>`;
        
        // 絵の部分のプレースホルダー
        let icon = '絵';
        if(card.type === 'energy') icon = '⚡';
        if(card.type === 'magic') icon = '✨';
        html += `<div class="img-placeholder">${icon}</div>`;
        
        html += `<div class="text">${card.text}</div>`;
        
        if (card.type === 'monster') {
            html += `<div class="stats">${card.atk} / ${card.hp}</div>`;
        }
        html += `</div>`;
        return html;
    }

    function render() {
        document.getElementById('opp-hp').innerText = oppHP;
        document.getElementById('pl-hp').innerText = plHP;
        document.getElementById('pl-energy').innerText = currentEnergy;
        document.getElementById('pl-max-energy').innerText = maxEnergy;

        document.getElementById('hand').innerHTML = hand.map((c, i) => createCardHTML(c, i, 'hand')).join('');
        document.getElementById('field').innerHTML = field.map((c, i) => createCardHTML(c, i, 'field')).join('');
    }

    // --- ゲーム開始処理 ---
    window.onload = () => {
        logMessage("ゲームスタート！ まずは手札から「エネルギー」を出そう！");
        for(let i = 0; i < 5; i++) drawCard();
        render();
    };
</script>

</body>
</html>
